[project]
name = "mini-agent"
version = "0.1.0"
description = "学习型最小 AI Agent 框架（仿 Hermes 架构，DeepSeek-only）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",        # DeepSeek 用 OpenAI 兼容 SDK（base_url 指向 api.deepseek.com）
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "grpcio>=1.60",        # gRPC surface（mini_agent/grpcserver）的运行时
    "grpcio-tools>=1.60",  # protoc + 插件；改了 .proto 要用它重新生成 mini_agent/gen/
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 必须用 find 而不是写死 packages = ["mini_agent"]：那样只装顶层那一个包，
# mini_agent.tools / .persistence / .grpcserver / .gen 全都不会被打进去，
# 装完 import 就报 ModuleNotFoundError。editable 安装碰巧看不出来（它把整个
# 源码树映射进去），所以这个坑只在真正打包分发时才炸。
include = ["mini_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 全项目一律用包绝对 import（from mini_agent.schema import ...），所以只需要
# 项目根在 sys.path 上。绝不要把 mini_agent/ 本身加进来——那会让 schema / config
# / log 这些通用名变成顶层模块，既污染命名空间，又让同一份代码有两个模块身份。
pythonpath = ["."]
markers = [
    # 真·进程级 kill 的崩溃恢复测试：要拉子进程，比其它测试慢一两个数量级。
    #   pytest -m "not slow"   平时开发
    #   pytest -m slow         单独跑崩溃恢复
    "slow: 需要拉子进程的慢测试（真 kill 崩溃恢复）",
]
# 放这里而不是 CI 命令行里：本地和 CI 跑的必须是同一条命令，否则"本地绿 CI 红"无从对照。
#
# -ra：汇总里列出所有 skip / xfail 及其原因。xfail 是"已知坏着"的显式声明，
#      不能让它安静地躺在那里没人看见。
# --strict-markers：未注册的 marker 直接报错。不加的话 @pytest.mark.slwo 只是个警告，
#      那条慢测试就会悄悄混进 -m "not slow"，CI 的 fast / slow 划分随之失真。
addopts = ["-ra", "--strict-markers"]
# 单个测试跑超过 120s 就把所有线程的栈 dump 出来。
# ★ 它只 dump、不杀进程——作用是"卡住时一眼看到卡在哪"，不是止损。
#   止损靠 CI job 的 timeout-minutes；本地卡住就 Ctrl+C。
faulthandler_timeout = 120
